name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verification:
    name: Source verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm version
        run: npm install --global npm@11.17.0

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: source-${{ matrix.os }}

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare non-release Tauri resource fixture
        run: npm run prepare:ci-resources

      - name: Run authoritative source gate
        run: npm run verify -- --source-only
