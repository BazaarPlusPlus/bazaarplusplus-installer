name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verification:
    name: Source verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked npm version
        run: npm install --global npm@11.17.0

      - name: Install repository Rust toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: source-${{ matrix.os }}

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare non-release Tauri resource fixture
        run: npm run prepare:ci-resources

      - name: Run authoritative source gate
        run: npm run verify -- --source-only

      - name: Diagnose Windows loader failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem src-tauri/target/debug/deps/bppinstaller_lib-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) {
            throw 'Windows test binary was not produced.'
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$installation/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found.'
          }

          Write-Output "Inspecting $($binary.FullName) with $($dumpbin.FullName)"
          & $dumpbin.FullName /dependents $binary.FullName
          & $dumpbin.FullName /imports $binary.FullName
